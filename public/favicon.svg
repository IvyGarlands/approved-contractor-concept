<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Approved Contractor">
  <!--
    The supporting mark: the stamp frame from StampMark.astro, reduced to the
    one glyph that survives 16 pixels.

    The A is drawn as a GABLE: apex, two rakes, a crossbar where the wall
    meets the roof. It is simultaneously the initial and the elevation, which
    is the whole identity in eleven line segments. Colours are the literal
    token values (a-700 plan-check red, n-900 graphite, n-000 paper); a
    favicon is fetched outside the document, so it cannot read a CSS variable
    and must not pretend to.
  -->
  <rect width="32" height="32" fill="#fbfcfd"/>
  <rect x="2.5" y="2.5" width="27" height="27" fill="none" stroke="#a63428" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="21" height="21" fill="none" stroke="#a63428" stroke-width="1"/>
  <path d="M9 24 L16 9.5 L23 24" fill="none" stroke="#0e1116" stroke-width="3" stroke-linejoin="miter"/>
  <path d="M12 18.5 H20" fill="none" stroke="#0e1116" stroke-width="2.5"/>
</svg>
